[package]
name = "agentmon-native-prototype"
version = "0.19.0"
description = "A native Agentmon workspace prototype"
authors = ["Agentmon Lab"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
